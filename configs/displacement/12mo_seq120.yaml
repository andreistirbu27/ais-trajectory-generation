# Full year 2024 data (gt80 split: tracks with 81+ pings), seq_len=120
# Training in progress

csv: data/processed/AIS_2024_gt80.csv
out_dir: runs/12mo_seq120

seq_len: 120
stride: 50
epochs: 20
val_frac: 0.15
seed: 42

d_model: 128
nhead: 8
num_layers: 3
dropout: 0.1
lambda_smooth: 5.0
loss_fn: mse

batch_size: 256
lr: 0.0003
weight_decay: 0.0001
grad_clip: 1.0
warmup_frac: 0.05
max_gap_sec: 600.0
use_velocity: true
pred_mode: causal

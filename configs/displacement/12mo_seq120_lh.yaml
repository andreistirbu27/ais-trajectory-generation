# Full year 2024 data with lighthouse distance features
# Uses enriched CSV from add_lighthouse_dist.py
# Based on 12mo_seq120_bs384.yaml with lighthouse features enabled

csv: data/processed/AIS_2024_gt80_lh.csv
out_dir: runs/12mo_seq120_lh

lighthouse_cols:
  - lh_dist_1_km
  - lh_dist_2_km
  - lh_dist_3_km

seq_len: 120
stride: 50
epochs: 40
val_frac: 0.15
seed: 42

d_model: 128
nhead: 8
num_layers: 3
dropout: 0.1
lambda_smooth: 5.0
loss_fn: mse

batch_size: 384
lr: 0.0003
weight_decay: 0.0001
grad_clip: 1.0
warmup_frac: 0.05
max_gap_sec: 600.0
use_velocity: true
pred_mode: causal

# Full year 2024 data, open-sea only (after inland/coastal filter)
# Based on 12mo_seq120_bs384.yaml with bs=256 (fewer rows → fewer steps/epoch)

csv: data/processed/AIS_2024_gt80_opensea.csv
out_dir: runs/12mo_seq120_opensea

seq_len: 120
stride: 50
epochs: 40
val_frac: 0.15
seed: 121

d_model: 128
nhead: 8
num_layers: 3
dropout: 0.1
lambda_smooth: 5.0
loss_fn: mse

batch_size: 256
lr: 0.0003
weight_decay: 0.0001
grad_clip: 1.0
warmup_frac: 0.05
max_gap_sec: 600.0
use_velocity: true
pred_mode: causal

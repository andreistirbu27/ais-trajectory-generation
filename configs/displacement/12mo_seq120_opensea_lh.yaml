# Full year 2024, open-sea only + lighthouse distance features (input_dim=8)
# Comparable to 12mo_seq120_opensea.yaml (same data/seed/hyperparams, +lighthouse)

csv: data/processed/AIS_2024_gt80_opensea_lh.csv
out_dir: runs/12mo_seq120_opensea_lh

lighthouse_cols:
  - lh_dist_1_km
  - lh_dist_2_km
  - lh_dist_3_km

seq_len: 120
stride: 50
epochs: 40
val_frac: 0.15
seed: 121

d_model: 128
nhead: 8
num_layers: 3
dropout: 0.1
lambda_smooth: 5.0
loss_fn: mse

batch_size: 256
lr: 0.0003
weight_decay: 0.0001
grad_clip: 1.0
warmup_frac: 0.05
max_gap_sec: 600.0
use_velocity: true
pred_mode: causal

# 4 weeks of data (1 week from Jan/Apr/Jul/Oct 2024), seq_len=120
# Result: CV baseline ADE 42.4m | Model ADE 40.7m (+4% over baseline)

csv: data/processed/AIS_2024_clean_v2.csv
out_dir: runs/4wk_seq120_e30

seq_len: 120
stride: 50
epochs: 40          # best.pt saved at ~epoch 30
val_frac: 0.15
seed: 42

d_model: 128
nhead: 8
num_layers: 3
dropout: 0.1
lambda_smooth: 5.0
loss_fn: mse

batch_size: 256
lr: 0.0003
weight_decay: 0.0001
grad_clip: 1.0
warmup_frac: 0.05
max_gap_sec: 600.0
use_velocity: true
pred_mode: causal

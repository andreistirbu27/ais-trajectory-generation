# Trajectory Generation v3 — stronger endpoint + scheduled sampling
# Changes from MVP: lambda_end 10→50, epochs 50→100, lambda_smooth 1→0.5,
#                    scheduled sampling ramp from epoch 20 to max 0.5
#
# Usage:
#   python3 scripts/train/train_gen.py --config configs/trajgen_v3.yaml

data_npz: data/processed/trajgen_128.npz
out_dir: runs/trajgen_v3

# Dataset
val_frac: 0.15
seed: 42

# Model
d_model: 128
nhead: 8
num_decoder_layers: 4
dim_feedforward: 512
dropout: 0.1

# Training
batch_size: 64
epochs: 100
lr: 0.0003
weight_decay: 0.0001
grad_clip: 1.0
warmup_frac: 0.05

# Loss weights
lambda_end: 50.0       # 5x stronger endpoint pull (was 10.0)
lambda_smooth: 0.5     # relaxed smoothness (was 1.0)

# Scheduled sampling
ss_warmup_epochs: 20   # pure teacher forcing for first 20 epochs
ss_max_prob: 0.5       # ramp to 50% model-prediction usage by end

# Logging
val_eval_batches: 30
log_every: 50
# Trajectory Generation v5 — v4 architecture + scheduled sampling
# Same model as v4 (bigger model + bearing features + encoder),
# plus scheduled sampling to reduce exposure bias.
#
# Usage:
#   python3 scripts/train/train_gen.py --config configs/trajgen_v5.yaml

data_npz: data/processed/trajgen_128.npz
out_dir: runs/trajgen_v5

# Dataset
val_frac: 0.15
seed: 42

# Model
d_model: 256
nhead: 8
num_encoder_layers: 2
num_decoder_layers: 4
dim_feedforward: 1024
dropout: 0.1

# Training
batch_size: 64   # SS uses two-pass parallel TF (≈2× TF cost, not 30×)
epochs: 60
lr: 0.0002
weight_decay: 0.0001
grad_clip: 1.0
warmup_frac: 0.05

# Loss weights
lambda_end: 10.0
lambda_smooth: 1.0

# Scheduled sampling
ss_warmup_epochs: 20
ss_max_prob: 0.5

# Logging
val_eval_batches: 30
log_every: 100

# Trajectory Generation MVP
# Conditional transformer decoder: (start, end, ship_type) → 128-point trajectory
#
# Usage:
#   python3 scripts/train/train_gen.py --config configs/trajgen_mvp.yaml

data_npz: data/processed/trajgen_128.npz
out_dir: runs/trajgen_mvp

# Dataset
val_frac: 0.15
seed: 42

# Model
d_model: 128
nhead: 8
num_decoder_layers: 4
dim_feedforward: 512
dropout: 0.1

# Training
batch_size: 64
epochs: 50
lr: 0.0003
weight_decay: 0.0001
grad_clip: 1.0
warmup_frac: 0.05

# Loss weights
lambda_end: 10.0      # endpoint accuracy (reaching destination)
lambda_smooth: 1.0     # smoothness regularization (acceleration penalty)

# Logging
val_eval_batches: 30
log_every: 50

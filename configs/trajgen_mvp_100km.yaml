# Trajectory Generation MVP — 100km+ dataset (filtered short ferry routes)
# Same hyperparameters as trajgen_mvp.yaml, different dataset.
#
# Usage:
#   python3 scripts/train/train_gen.py --config configs/trajgen_mvp_100km.yaml

data_npz: data/processed/trajgen_128_100km.npz
out_dir: runs/trajgen_mvp_100km

# Dataset
val_frac: 0.15
seed: 42

# Model
d_model: 128
nhead: 8
num_decoder_layers: 4
dim_feedforward: 512
dropout: 0.1

# Training
batch_size: 64
epochs: 50
lr: 0.0003
weight_decay: 0.0001
grad_clip: 1.0
warmup_frac: 0.05

# Loss weights
lambda_end: 10.0
lambda_smooth: 1.0

# Logging
val_eval_batches: 30
log_every: 50

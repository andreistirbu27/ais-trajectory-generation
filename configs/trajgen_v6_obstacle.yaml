# Trajectory Generation v6 — Obstacle-Conditioned
# v5 architecture (bigger model + bearing + encoder + scheduled sampling)
# plus synthetic obstacle conditioning with penetration loss.
#
# Usage:
#   python3 scripts/train/train_gen_obs.py --config configs/trajgen_v6_obstacle.yaml

data_npz: data/processed/trajgen_128.npz
out_dir: runs/trajgen_v6_obstacle

# Dataset
val_frac: 0.15
seed: 42

# Model
d_model: 256
nhead: 8
num_encoder_layers: 2
num_decoder_layers: 4
dim_feedforward: 1024
dropout: 0.1

# Training
batch_size: 64
epochs: 60
lr: 0.0002
weight_decay: 0.0001
grad_clip: 1.0
warmup_frac: 0.05

# Loss weights
lambda_end: 10.0
lambda_smooth: 1.0
lambda_obstacle: 50.0
obstacle_margin_km: 5.0

# Scheduled sampling — disabled (MPS OOM / ~15h-per-epoch when SS is on;
# v3 null result suggests SS doesn't break the plateau anyway).
# Set ss_warmup_epochs > epochs to ensure SS never activates.
ss_warmup_epochs: 999
ss_max_prob: 0.0

# Obstacles
max_obstacles: 3
p_obstacle: 0.5
obstacle_radius_min_km: 10
obstacle_radius_max_km: 100

# Logging
val_eval_batches: 30
log_every: 100
